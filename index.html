<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Құс фермасы</title>
<style>
:root{--sky1:#9fd3f5;--sky2:#fff0c9;--far:#9fb0c8;--hill:#8cc271;--grass:#6fae55;--leaf:#4f9a45;--bg:#fff6dc;--card:#fff;--ink:#4a3320;--mut:#8a7358;--acc:#e8a33d;--ok:#5aa65a;--line:#f0dfb4;--bar:#f3e6c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(var(--sky1),var(--sky2)) fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.w{max-width:720px;margin:0 auto;padding:10px 12px 80px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700}
.top .sp{flex:1}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--acc);color:#3b2506;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.g{background:var(--ok);color:#fff}
.tabs{display:flex;gap:6px;margin:6px 0 10px}.tabs button{flex:1;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.tabs button.on{background:var(--acc);color:#3b2506;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.nest{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;cursor:pointer;user-select:none}
.nest .e{font-size:44px;line-height:1.1}.nest small{color:var(--mut);display:block}
.nest.has{border-color:var(--ok);box-shadow:0 0 0 3px #5aa65a44}
.bar{height:8px;background:var(--bar);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:8px;margin:10px 0}.row button{flex:1}
.li{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.li .e{font-size:34px}.li .t{flex:1;min-width:0}.li b{display:block}.li small{color:var(--mut)}
.c{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer}
.c .e{font-size:34px}.c small{display:block;font-size:11px;color:var(--mut)}.c.lock .e{filter:grayscale(1) brightness(.3)}
.m{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}

.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:10px;border:2px solid var(--line)}.hero svg{display:block;width:100%;height:auto}.ht{position:absolute;left:12px;top:8px;font-weight:800;color:#fff;text-shadow:0 1px 3px #0006}
.bw{padding:2px 6px 0}.bw svg{display:block;width:100%;max-width:150px;margin:0 auto}
.nb{height:16px;margin:-12px 6px 6px;border-radius:50%;background:radial-gradient(#c79a55,#8a5a2b);box-shadow:inset 0 -3px 0 #0003}.nb.l2,.nb.l3{background:radial-gradient(#d9b36a,#7a4a1f)}.nb.l4,.nb.l5{background:radial-gradient(#ffe08a,#b9801f);box-shadow:0 0 8px #ffd54f}
.up{width:100%;margin-top:6px;padding:6px;font-size:13px}.nest.pop .bw{animation:pop .7s}@keyframes pop{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#bg{position:fixed;left:0;right:0;bottom:0;height:min(50vw,45vh);z-index:-1;opacity:.85;pointer-events:none}#bg svg{width:100%;height:100%}
.add{border-style:dashed;display:flex;flex-direction:column;justify-content:center}.hint{color:var(--mut);font-size:13px}.c svg{display:block;width:100%}
.tabs{flex-wrap:wrap}.tabs button{min-width:30%;padding:8px 4px;font-size:13px}
.rain{position:absolute;inset:0;background-image:linear-gradient(100deg,transparent 45%,#fff9 50%,transparent 55%);background-size:8px 24px;animation:rn .4s linear infinite;opacity:.5;pointer-events:none}@keyframes rn{to{background-position:-8px 24px}}
.wind{position:absolute;left:0;top:50px;font-size:20px;animation:wd 6s linear infinite;pointer-events:none}@keyframes wd{from{transform:translateX(-60px)}to{transform:translateX(110vw)}}
.ht2{position:absolute;right:10px;top:8px;background:#0005;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.ev{position:fixed;z-index:20;font-size:54px;line-height:1;background:none;border:0;padding:0;cursor:pointer;user-select:none}.fly{top:14%;left:100%;animation:fl 9s linear forwards}@keyframes fl{to{transform:translateX(-130vw)}}.raid{animation:shk .35s infinite alternate}@keyframes shk{from{transform:rotate(-12deg)}to{transform:rotate(12deg) scale(1.15)}}
#hero3d{position:absolute;inset:0}.hero{height:clamp(230px,60vw,330px)}.hero svg{height:100%}
.hero{height:clamp(310px,82vw,450px)}.tabs button{min-width:22%}.grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr))}.nest{padding:8px}.bw svg{max-width:96px}.up{padding:5px;font-size:12px}
.qb{width:100%;text-align:left;margin:5px 0;background:var(--card);color:var(--ink);border:2px solid var(--line)}.qb.ok{background:#5aa65a;color:#fff;border-color:#5aa65a}.qb.no{background:#d9534f;color:#fff;border-color:#d9534f}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#4a3320;color:#fff;padding:8px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:10}
.toast.on{opacity:1}h3{margin:14px 0 8px}
</style></head><body><div id="bg"></div><div class="w">
<div class="top"><span class="pill" id="co"></span><span class="pill" id="ba"></span><span class="sp"></span><button id="mu" style="padding:8px 10px;background:var(--card);border:2px solid var(--line)">🔊</button><button class="g" id="sell">Сату</button></div>
<div class="tabs"><button data-t="f">🌾 Ферма</button><button data-t="s">🛒 Дүкен</button><button data-t="b">🥖 Нан</button><button data-t="q">📜 Квест</button><button data-t="m">🗺 Әлем</button><button data-t="o">📦 Қойма</button><button data-t="z">🧠 Викторина</button><button data-t="k">📖 Коллекция</button></div>
<div id="v"></div></div>
<div class="m" id="m"><div id="mc"></div></div><div class="toast" id="to"></div>

<script>
// [атауы, латынша, эмодзи, мәртебесі, ерекшелігі]
const B=[
["Көк кептер","Columba livia","🕊️","Отырықшы","Көгершіндер үйіне қайту жолын күн бағытымен, жер бедерімен және магнит өрісімен табады."],
["Үй торғайы","Passer domesticus","🐦","Отырықшы","Топтасып тіршілік етіп, қауіп төнгенде бір-біріне дыбыспен белгі береді."],
["Дала торғайы","Passer montanus","🐤","Отырықшы","Аталығы мен аналығының сыртқы келбеті бір-біріне өте ұқсас."],
["Бозторғай","Alauda arvensis","🎵","Жыл құсы","Аспанға көтеріліп, бір орында қалықтап тұрып ән салады."],
["Үлкен шымшық","Parus major","🐥","Отырықшы","Көптеген зиянкес жәндіктермен қоректеніп, ағаштарды қорғайды."],
["Барылдауық үйрек","Anas platyrhynchos","🦆","Жыл құсы","Үй үйректерінің көптеген тұқымдары осы үйректен тараған."],
["Сауысқан","Pica pica","🐦‍⬛","Отырықшы","Өте зерек, адамның бет-әлпетін есте сақтай алады."],
["Кәдімгі сарықас","Phylloscopus collybita","🌿","Жыл құсы","Әні қайталанатын қысқа, сыңғырлаған дыбыстардан тұрады."],
["Кәдімгі күйкентай","Falco tinnunculus","🦅","Жыртқыш","Жемтігін іздегенде ауада бір орында қалықтап тұра алады."],
["Кәдімгі қызылқұйрық","Phoenicurus phoenicurus","🔥","Жыл құсы","Қонған кезде құйрығын жиі қозғалтып отырады."],
["Сарыбас королек","Regulus regulus","⭐","Көшпелі","Еуропадағы ең кішкентай құстардың бірі, салмағы 5–7 грамм."],

["Ұзынқұйрық шымшық","Aegithalos caudatus","☁️","Отырықшы-көшпелі","Мүк, қына және өрмекші торынан жабық ұя жасайды."],
["Құлақты жапалақ","Asio otus","🦉","Түнгі жыртқыш","Басындағы «құлақтары» шын құлағы емес, қауырсыннан жасалған айдар."],
["Кәдімгі чечетка","Acanthis flammea","❄️","Көшпелі","Суық аймақтарда тіршілікке бейімделген, көбіне топтасып жүреді."],
["Қасқалдақ","Fulica atra","🦢","Жыл құсы","Үйрекке ұқсаса да, сутартарлар тобына жатады."],
["Көк шымшық","Cyanistes caeruleus","💙","Отырықшы","Жіңішке бұтаққа басын төмен қаратып ілініп, жәндіктерді теріп жейді."],
["Сұр қаз","Anser anser","🪿","Жыл құсы","Үй қаздарының көптеген тұқымдары осы қаздан тараған."],
["Кәдімгі тауқұдірет","Troglodytes troglodytes","🪵","Көшпелі","Кішкентай болса да, дауысы қатты әрі анық естіледі."],

["Үлкен сұқсыр","Podiceps cristatus","🌊","Жыл құсы","Балапандары алғашқы апталарда ата-анасының арқасында жүреді."],
["Қара сайрақ","Turdus merula","🎶","Жыл құсы","Әні әуезді әрі әртүрлі дыбыстардан құралады."],
["Көл шағаласы","Chroicocephalus ridibundus","🌅","Жыл құсы","Қорегін судан да, құрлықтан да іздей алады."],
["Ала қарға","Corvus cornix","🧠","Отырықшы","Құралдарды пайдаланып, күрделі тапсырмаларды шешеді."],
["Ұзақ","Corvus frugilegus","🏰","Көшпелі","Үлкен топпен тіршілік етіп, ағаштарға колония құрып ұя салады."],
["Ақ шақшақай","Motacilla alba","💃","Жыл құсы","Жерде секіріп қана қоймай, аяғын жылдам басып жүгіреді."],
["Сыбырлақ аққу","Cygnus olor","👑","Жыл құсы","Қауіп төнгенде немесе аумағын қорғағанда ысылдайды."]];

function bowlUpd(){const f=Math.min(1,S.bowl/BC);food.visible=S.bowl>.05;food.scale.set(.2+.26*f,.04+.12*f,.2+.26*f);if(pb>0&&S.bowl<=0){S.bowl=0;toast(S.feed>0?'Ыдыс бос! Жем сал 🌾':'Жем таусылды! Дүкенден сатып ал 🛒')}pb=S.bowl}
function freeSlot(b){if(b.slot){SL[b.slot-1]=null;b.slot=0}}
function takeSlot(b){for(let i=0;i<6;i++)if(!SL[i]){SL[i]=b;b.slot=i+1;const a=i/6*6.28+.4;b.tg.set(BW.x+Math.cos(a)*.95,0,BW.z+Math.sin(a)*.8);b.st='goeat';b.t=12;return true}return false}
window.call3d=function(){if(night())return;BS.filter(b=>!b.ins&&!b.slot&&b.rt<=0).sort((a,c)=>a.g.position.distanceTo(BW)-c.g.position.distanceTo(BW)).slice(0,6).forEach(b=>takeSlot(b))};
function upd(b,dt,tm){const g=b.g,u=g.userData,nk=u.neck,legs=u.legs,wings=u.wings,k=Math.min(1,dt*8),nt=night();
 if(b.sg<1)b.sg=Math.min(1,b.sg+dt*1.8);const e=1+2.70158*Math.pow(b.sg-1,3)+1.70158*Math.pow(b.sg-1,2);g.scale.setScalar(Math.max(.001,SZ[b.s]*.95*(1+.06*b.lv)*e));
 if(nt!==b.nt){const ini=b.nt==null;b.nt=nt;freeSlot(b);if(nt){if(ini){if(b.cap){b.ins=true;g.visible=false}else b.st='rest'}else b.nd=1+Math.random()*7}else{b.nd=0;if(b.ins)b.xt=Math.random()*6+.1;else{b.st='idle';b.t=1}}}
 if(b.ins){if(b.xt>0){b.xt-=dt;if(b.xt<=0){b.ins=false;g.visible=true;g.position.set(DR.x,0,DR.z+.2);b.st='walk';b.tg.copy(b.home);b.t=9}}return}
 if(nt&&b.nd>0){b.nd-=dt;if(b.nd<=0){freeSlot(b);if(b.cap){b.st='enter';b.tg.copy(DR);b.t=20}else b.st='rest'}}
 b.t-=dt;let walk=0,pitch=0,flap=0,hop=0,sit=0;const mvg=b.st=='walk'||b.st=='enter'||b.st=='goeat';
 if(b.rt>0){b.rt-=dt;flap=1;hop=Math.abs(Math.sin((1.2-b.rt)*Math.PI*2.5))*.5;g.rotation.y+=dt*9;pitch=-.3;if(b.rt<=0){b.st='idle';b.t=1}}
 else if(mvg){const dx=b.tg.x-g.position.x,dz=b.tg.z-g.position.z,d=Math.hypot(dx,dz);if(d<.12||b.t<=0){if(b.st=='enter'){b.ins=true;g.visible=false;b.xt=0;return}if(b.st=='goeat'){b.st='eat';b.t=3+Math.random()*3}else{b.st='idle';b.t=1+Math.random()*2}}else{walk=1;let df=Math.atan2(dx,dz)-g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));g.rotation.y+=df*Math.min(1,dt*6);const sp=Math.min(d,.7*dt*(.6+SZ[b.s]*.5));g.position.x+=dx/d*sp;g.position.z+=dz/d*sp}}
 else if(b.st=='eat'){let df=Math.atan2(BW.x-g.position.x,BW.z-g.position.z)-g.rotation.y;g.rotation.y+=Math.atan2(Math.sin(df),Math.cos(df))*Math.min(1,dt*5);pitch=.75+.3*Math.sin(tm*13+b.ph0);if(S.bowl>0)S.bowl=Math.max(0,S.bowl-dt*.12);else b.t=0;if(b.t<=0){freeSlot(b);b.st='idle';b.t=1+Math.random()*2}}
 else if(b.st=='rest'){sit=1;pitch=.2}
 else if(b.st=='peck'){pitch=(u.nl>.3?.95:.6)+.3*Math.sin(tm*15);if(b.t<=0){b.st='idle';b.t=1+Math.random()*2}}
 else if(b.st=='flap'){flap=1;hop=Math.abs(Math.sin(tm*14))*.12;if(b.t<=0){b.st='idle';b.t=1.5}}
 else if(b.t<=0){const r=Math.random();if(!nt&&S.bowl>1&&r<.45&&takeSlot(b)){}else if(r<.6){b.st='walk';b.t=7;b.tg.set(b.home.x+(Math.random()*2-1)*b.wr,0,b.home.z+(Math.random()*2-1)*b.wz)}else if(r<.78){b.st='peck';b.t=1.7}else if(r<.86){b.st='flap';b.t=1.1}else{b.hy=(Math.random()*2-1)*1.1;b.t=1+Math.random()*1.5}}
 b.ph+=dt*(walk?11:0);
 legs[0].rotation.x=L(legs[0].rotation.x,Math.sin(b.ph)*.7*walk,k);legs[1].rotation.x=L(legs[1].rotation.x,-Math.sin(b.ph)*.7*walk,k);
 u.body.position.y=L(u.body.position.y,u.by-sit*.14+Math.abs(Math.sin(b.ph))*.05*walk,k);g.position.y=hop;
 nk.rotation.x=L(nk.rotation.x,pitch+(walk?Math.sin(b.ph*.5)*.12:0),k);nk.rotation.y=L(nk.rotation.y,b.st=='idle'?b.hy:0,Math.min(1,dt*5));
 wings.forEach((w,j)=>{const s=j?1:-1,a=flap?Math.sin(tm*30)*.5+.6:sit?.02:.05;w.rotation.z=L(w.rotation.z,s*a,Math.min(1,dt*20))})}
function lights(){const n=night(),w=wx();sun.intensity=(n?.3:.95)*(w==1?.75:1);sun.color.set(n?0x8899ff:0xfff2d0);hemi.intensity=n?.4:.75;winMat.emissive.setHex(n?0xffc25a:0);lampMat.emissive.setHex(n?0xffd860:0)}
function draw(){R.render(sc,cam)}
let last=0,tm=0,lt=1;function loop(ts){requestAnimationFrame(loop);if(!cv.isConnected||document.hidden)return;const d0=(ts-last)/1000;if(d0<.028)return;last=ts;const dt=Math.min(d0,.06);tm+=dt;lt+=dt;if(lt>1){lt=0;lights()}BS.forEach(b=>upd(b,dt,tm));bowlUpd();draw()}
requestAnimationFrame(loop);
let W=0,H=0;window.attach3d=function(){const h=document.getElementById('hero3d');if(!h)return;if(cv.parentNode!==h)h.appendChild(cv);const w=h.clientWidth,hh=h.clientHeight;if(w&&hh&&(w!=W||hh!=H)){W=w;H=hh;R.setSize(w,hh,false);cam.aspect=w/hh;cam.updateProjectionMatrix()}fit();sync();lights();draw()};
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects([...BS.filter(b=>!b.ins).map(b=>b.g),bg,cg],true)[0];if(!h)return;let o=h.object;while(o&&!o.userData.bird&&!o.userData.kind)o=o.parent;if(!o)return;if(o.userData.kind=='bowl'){pour();return}if(o.userData.kind=='coop'){toast('🛖 Үйшік '+(S.cl||1)+'/5 · сыйымдылық '+copCap()+' · құс '+BS.length);return}{const b=o.userData.bird;if(b.rt>0)return;freeSlot(b);b.rt=1.2;b.st='react';snd('pop');toast(B[b.s][0]+' '+B[b.s][2])}});
})();
setSky(true);
tick();render();
setInterval(()=>{tick();evs();setSky();if(S.tab!="k"&&!$("m").classList.contains("on")){render()}save()},1000);
